name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Synthetic credentials used strictly for compile-time env validation.
    # NEVER point PR CI at production Supabase or expose production secrets.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-preview.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyZWYiOiJjaS1wcmV2aWV3Iiwicm9sZSI6ImFub24ifQ.ci-not-a-real-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check isolated staging HTTP test (no network calls)
        run: node --check scripts/qa/verify-staging-anon-http.mjs

      - name: Syntax-check isolated staging media and Realtime tests (no network calls)
        run: |
          node --check scripts/qa/verify-staging-profile-image-lifecycle.mjs
          node --check scripts/qa/verify-staging-realtime-privacy.mjs
          node --check scripts/qa/verify-staging-account-deletion.mjs

      - name: Lint
        run: npm run lint

      - name: Build (compile only, no production credentials)
        run: npm run build

      # Schema, RLS, security RPCs, and storage require separately approved
      # isolated STAGING integration tests. They must not use production keys
      # or run production SQL in pull-request CI.
